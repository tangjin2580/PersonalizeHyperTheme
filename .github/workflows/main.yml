name: Android CI

on:
  push:
    branches: [ main, api102 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Android SDK targets (android-37 platform + build-tools 36.0.0)
        # 直接调用 GitHub runner 自带的 sdkmanager。关键排错手段：通过 ::error:: / ::notice:: workflow
        # 命令把“可用平台列表”和“安装失败原因”写成 annotation——annotation 可通过 GitHub API
        # （actions/runs/<id>/annotations）匿名读取，而 workflow 日志本身匿名读不到。
        run: |
          set +e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -z "$SDKMANAGER" ] && SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version 2>&1 | head -3 || true

          # 把 runner 仓库里“实际可用的 SDK Platform 版本”写成 notice（匿名 API 可读），
          # 这样若后面安装失败，我们能直接看到正确的包名该写什么。
          PLATFORMS=$("$SDKMANAGER" --list 2>/dev/null | grep -E 'Android SDK Platform' | head -40 | tr '\n' '%0A')
          echo "::notice title=Available SDK Platforms::${PLATFORMS}"

          echo "Accepting all SDK licenses..."
          yes | "$SDKMANAGER" --licenses >/tmp/lic.txt 2>&1 || true

          install_one() {
            local pkg="$1"
            echo "::group::install $pkg"
            yes | "$SDKMANAGER" "$pkg" 2>&1 | tee -a /tmp/sdk_out.txt
            local rc=${PIPESTATUS[0]}
            echo "exit=$rc for $pkg"
            echo "::endgroup::"
            return $rc
          }

          OK=1
          for p in "platforms;android-37.2" "build-tools;36.0.0" "platform-tools"; do
            install_one "$p" || OK=0
          done

          echo "---- sdkmanager combined tail ----" >> "$GITHUB_STEP_SUMMARY"
          tail -30 /tmp/sdk_out.txt >> "$GITHUB_STEP_SUMMARY"

          if [ "$OK" -eq 0 ]; then
            echo "::error::SDK install failed. Matching sdkmanager output:"
            grep -iE 'failed|error|warning|not found|could not|exception' /tmp/sdk_out.txt | head -20 | sed 's/^/::error::/'
            echo "::error::full tail:"
            tail -25 /tmp/sdk_out.txt | sed 's/^/::error::/'
            exit 1
          fi
          echo "::notice::Android SDK install completed successfully"
          exit 0

      - name: Decode signing key (mrli-key.jks)
        # 仅在仓库配置了 Secrets 时才签名，否则出未签名包（构建不阻塞）。
        # 需要 4 个 Secret：MRLI_KEY_JKS_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 注意：step 级 if 不能使用 secrets 上下文（GitHub 限制），故把“是否配置密钥”的判断放到脚本里。
        env:
          MRLI_KEY_JKS_BASE64: ${{ secrets.MRLI_KEY_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$MRLI_KEY_JKS_BASE64" ]; then
            echo "$MRLI_KEY_JKS_BASE64" | base64 -d > app/mrli-key.jks
            {
              echo "KEYSTORE_FILE=${{ github.workspace }}/app/mrli-key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key decoded; release APK will be signed."
          else
            echo "MRLI_KEY_JKS_BASE64 not set; building unsigned APK."
          fi

      - name: Build Debug APK (for testing)
        run: ./gradlew assembleDebug

      - name: Build Release APK (signed if key present)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/PersonalizeHyperTheme-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/PersonalizeHyperTheme-*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## 更新内容
            - Jetpack Compose 现代化界面
            - 系统快捷操作：重启桌面 / 智能助理 / 主题
            - 状态栏 edge-to-edge 融合 + 底部社交图标
            - 检查更新功能
            - libxposed 102 迁移（LSPosed 新框架，入口 META-INF/xposed/java_init.list）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
