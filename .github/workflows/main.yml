name: Android CI

on:
  push:
    branches: [ main, api102 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK (incl. android-37 + build-tools 36.0.0)
        uses: android-actions/setup-android@v3
        with:
          # 默认是 "tools platform-tools"，覆盖时必须把这两项也带上；
          # 再加 libxposed 102 要求的 platforms;android-37 与 build-tools;36.0.0
          packages: 'tools platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Decode signing key (mrli-key.jks)
        # 仅在仓库配置了 Secrets 时才签名，否则出未签名包（构建不阻塞）。
        # 需要 4 个 Secret：MRLI_KEY_JKS_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 注意：step 级 if 不能使用 secrets 上下文（GitHub 限制），故把“是否配置密钥”的判断放到脚本里。
        env:
          MRLI_KEY_JKS_BASE64: ${{ secrets.MRLI_KEY_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$MRLI_KEY_JKS_BASE64" ]; then
            echo "$MRLI_KEY_JKS_BASE64" | base64 -d > app/mrli-key.jks
            {
              echo "KEYSTORE_FILE=${{ github.workspace }}/app/mrli-key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key decoded; release APK will be signed."
          else
            echo "MRLI_KEY_JKS_BASE64 not set; building unsigned APK."
          fi

      - name: Build Debug APK (for testing)
        run: ./gradlew assembleDebug

      - name: Build Release APK (signed if key present)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/PersonalizeHyperTheme-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/PersonalizeHyperTheme-*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## 更新内容
            - Jetpack Compose 现代化界面
            - 系统快捷操作：重启桌面 / 智能助理 / 主题
            - 状态栏 edge-to-edge 融合 + 底部社交图标
            - 检查更新功能
            - libxposed 102 迁移（LSPosed 新框架，入口 META-INF/xposed/java_init.list）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
