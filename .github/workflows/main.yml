name: Android CI

on:
  push:
    branches: [ main, api102 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK (with cache)
        # 用 action 装好 SDK 根 + 最新 cmdline-tools（runner 自带的 cmdline-tools/16.0 太旧，
        # 解析不了 android-37；action 会下载最新版 sdkmanager 并缓存到 ~/android-sdk，主分支同款）。
        uses: android-actions/setup-android@v3
        with:
          android-sdk-file: ~/android-sdk

      - name: Install API 37 platform + build-tools 36.0.0
        # 装本项目精确需要的包。失败时把 sdkmanager 完整输出以 commit comment 回写
        # （GITHUB_TOKEN 在 workflow 内可用，匿名 API 可读），彻底解决“日志读不到”的盲调问题。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version 2>&1 | head -2 || true
          yes | "$SDKMANAGER" --licenses >/tmp/lic.txt 2>&1 || true
          OUT="$(mktemp)"
          yes | "$SDKMANAGER" "platforms;android-37.2" "build-tools;36.0.0" "platform-tools" >"$OUT" 2>&1
          RC=$?
          echo "sdkmanager install rc=$RC"
          tail -25 "$OUT"
          if [ "$RC" -ne 0 ]; then
            BODY="$(tail -c 3500 "$OUT")"
            {
              echo "SDK INSTALL FAILED (run ${GITHUB_RUN_ID:-?}) rc=$RC"
              echo
              echo "--- sdkmanager output (tail) ---"
              echo "$BODY"
            } | jq -Rs '{body: .}' > /tmp/payload.json
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              --data @/tmp/payload.json | head -c 400
            echo "::error::SDK install failed rc=$RC; see commit comment on $GITHUB_SHA"
            exit 1
          fi
          echo "::notice::Android SDK (api37 + build-tools 36.0.0) installed"
          exit 0

      - name: Decode signing key (mrli-key.jks)
        # 仅在仓库配置了 Secrets 时才签名，否则出未签名包（构建不阻塞）。
        # 需要 4 个 Secret：MRLI_KEY_JKS_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 注意：step 级 if 不能使用 secrets 上下文（GitHub 限制），故把“是否配置密钥”的判断放到脚本里。
        env:
          MRLI_KEY_JKS_BASE64: ${{ secrets.MRLI_KEY_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$MRLI_KEY_JKS_BASE64" ]; then
            echo "$MRLI_KEY_JKS_BASE64" | base64 -d > app/mrli-key.jks
            {
              echo "KEYSTORE_FILE=${{ github.workspace }}/app/mrli-key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key decoded; release APK will be signed."
          else
            echo "MRLI_KEY_JKS_BASE64 not set; building unsigned APK."
          fi

      - name: Build Debug APK (for testing)
        run: ./gradlew assembleDebug

      - name: Build Release APK (signed if key present)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/PersonalizeHyperTheme-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/PersonalizeHyperTheme-*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## 更新内容
            - Jetpack Compose 现代化界面
            - 系统快捷操作：重启桌面 / 智能助理 / 主题
            - 状态栏 edge-to-edge 融合 + 底部社交图标
            - 检查更新功能
            - libxposed 102 迁移（LSPosed 新框架，入口 META-INF/xposed/java_init.list）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
