name: Android CI

on:
  push:
    branches: [ main, api102 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Android SDK targets (android-37 platform + build-tools 36.0.0)
        # 直接调用 GitHub runner 自带的 sdkmanager（/usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager，cmdline-tools 16.0），
        # 它能识别 android-37 这类新包；并把输出写入 job Summary 便于排错（API 可读取，无需 admin 权限）。
        run: |
          set +e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          echo "Using sdkmanager: ${SDKMANAGER:-NONE}"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37" "build-tools;36.0.0" "platform-tools" 2>&1 | tee /tmp/sdk_out.txt
          RC=${PIPESTATUS[0]}
          echo "---- sdkmanager tail ----" >> "$GITHUB_STEP_SUMMARY"
          tail -25 /tmp/sdk_out.txt >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Decode signing key (mrli-key.jks)
        # 仅在仓库配置了 Secrets 时才签名，否则出未签名包（构建不阻塞）。
        # 需要 4 个 Secret：MRLI_KEY_JKS_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
        # 注意：step 级 if 不能使用 secrets 上下文（GitHub 限制），故把“是否配置密钥”的判断放到脚本里。
        env:
          MRLI_KEY_JKS_BASE64: ${{ secrets.MRLI_KEY_JKS_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$MRLI_KEY_JKS_BASE64" ]; then
            echo "$MRLI_KEY_JKS_BASE64" | base64 -d > app/mrli-key.jks
            {
              echo "KEYSTORE_FILE=${{ github.workspace }}/app/mrli-key.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing key decoded; release APK will be signed."
          else
            echo "MRLI_KEY_JKS_BASE64 not set; building unsigned APK."
          fi

      - name: Build Debug APK (for testing)
        run: ./gradlew assembleDebug

      - name: Build Release APK (signed if key present)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/PersonalizeHyperTheme-*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/PersonalizeHyperTheme-*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
          draft: false
          prerelease: false
          body: |
            ## 更新内容
            - Jetpack Compose 现代化界面
            - 系统快捷操作：重启桌面 / 智能助理 / 主题
            - 状态栏 edge-to-edge 融合 + 底部社交图标
            - 检查更新功能
            - libxposed 102 迁移（LSPosed 新框架，入口 META-INF/xposed/java_init.list）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
